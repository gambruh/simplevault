version: '3'

services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - app1
      - app2

  app1:
    image: simplevault-image
    container_name: app1
    environment:
      - POSTGRES_USER=youruser
      - POSTGRES_PASSWORD=yourpassword
    ports:
      - "8081:8080" 
    depends_on:
      - db

  app2:
    image: simplevault-image
    container_name: app2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "8082:8080"  
    depends_on:
      - db


  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
